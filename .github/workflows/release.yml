name: Release

# Publishes both packages when the release pull request opened by prepare_release.yml is merged.
# Builds and tests in Release, packs, pushes to nuget.org with a short-lived key from trusted
# publishing, then `knope release` tags the merge commit and creates the GitHub release with the
# changelog entry as notes and the packages attached. See the Releasing section of README.md.

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  publish:
    if: github.head_ref == 'release' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # tag and create the GitHub release
      id-token: write # OIDC token for NuGet trusted publishing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # The commit that landed on main, so the tag points at the release itself.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: '10.0.x'

      - run: dotnet build -c Release
      - run: dotnet test --no-build -c Release
      - run: dotnet pack --no-build -c Release -o artifacts

      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        # A .snupkg next to its .nupkg is pushed with it. --skip-duplicate makes a re-run harmless.
        run: dotnet nuget push 'artifacts/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.23.0

      - name: Tag and create the GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: knope release
