[package]
versioned_files = [
  { path = "Directory.Build.props", regex = '<Version>(?<version>[^<]+)</Version>' },
]
changelog = "CHANGELOG.md"
assets = "artifacts/*"

[changes]
ignore_conventional_commits = true

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -c release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: prepare release $version\""

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore: prepare release $version"

[workflows.steps.body]
template = """
Merging this pull request publishes FSharp.Astro.Units and FSharp.Astro.Fits $version to nuget.org and creates the GitHub release. Knope keeps it up to date as change files land on main.

$changelog
"""

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

[github]
owner = "leonitousconforti"
repo = "fsharp-astro"
